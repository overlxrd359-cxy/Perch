name: campus-seat-prod

# 生产编排：只有 Caddy 暴露端口，其余服务全部走内部网络。
# 使用前：
#   1. cp .env.example .env 并填写真实密钥
#   2. 前端构建产物放到 ./data/frontend
#   3. DOMAIN 环境变量设置为你的域名

x-backend-env: &backend-env
  ENV: prod
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必填}
  DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-seat}:${MYSQL_PASSWORD:?MYSQL_PASSWORD 必填}@mysql:3306/${MYSQL_DATABASE:-campus_seat}?charset=utf8mb4
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  CORS_ORIGINS: https://${DOMAIN:?DOMAIN 必填}

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: campus-seat-api:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: campus-seat-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.tasks.worker"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必填}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_seat}
      MYSQL_USER: ${MYSQL_USER:-seat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必填}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  caddy_data:
  caddy_config: